<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Área de Socios — EZSENCIA</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <style>
        html, body { min-height: 100vh; }
        body {
            display:         flex;
            align-items:     center;
            justify-content: center;
            background:      var(--fondo-alt);
            padding:         2rem;
        }
        .login-wrap { width: 100%; max-width: 400px; text-align: center; }
        .login-logo {
            font-family: 'Lato', sans-serif; font-size: 0.62rem;
            letter-spacing: 0.44em; text-transform: uppercase;
            color: var(--tinta); text-decoration: none; display: block;
            margin-bottom: 3.5rem; transition: opacity 0.3s;
        }
        .login-logo:hover { opacity: 0.5; }
        .login-eyebrow {
            font-family: 'Lato', sans-serif; font-size: 0.56rem;
            letter-spacing: 0.36em; text-transform: uppercase;
            color: var(--dorado); opacity: 0.8; display: block; margin-bottom: 1rem;
        }
        .login-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 400; font-style: italic;
            color: var(--tinta); margin: 0 0 2rem; line-height: 1.15;
        }
        .login-sep {
            width: 28px; height: 1px; background: var(--dorado);
            opacity: 0.45; margin: 0 auto 2.5rem;
        }
        .login-field { margin-bottom: 1.2rem; text-align: left; }
        .login-label {
            font-family: 'Lato', sans-serif; font-size: 0.56rem;
            letter-spacing: 0.28em; text-transform: uppercase;
            color: var(--tinta-suave); opacity: 0.55; display: block; margin-bottom: 0.5rem;
        }
        .login-input {
            width: 100%; padding: 0.85rem 1rem; background: var(--fondo);
            border: 1px solid var(--borde); color: var(--tinta);
            font-family: 'EB Garamond', serif; font-size: 1rem;
            outline: none; transition: border-color 0.3s; box-sizing: border-box;
            -webkit-appearance: none;
        }
        .login-input:focus { border-color: var(--dorado); }
        .login-input::placeholder { opacity: 0.3; }
        .login-btn {
            width: 100%; padding: 1rem; background: var(--tinta); color: var(--fondo);
            font-family: 'Lato', sans-serif; font-size: 0.6rem; letter-spacing: 0.34em;
            text-transform: uppercase; border: none; cursor: pointer;
            margin-top: 1rem; transition: opacity 0.3s;
        }
        .login-btn:hover    { opacity: 0.72; }
        .login-btn:disabled { opacity: 0.35; cursor: default; }
        .login-error {
            font-family: 'EB Garamond', serif; font-size: 0.95rem;
            color: #b94040; margin-top: 1.2rem; display: none; line-height: 1.6;
        }
        .login-footer {
            margin-top: 4rem; font-family: 'Lato', sans-serif; font-size: 0.55rem;
            letter-spacing: 0.22em; text-transform: uppercase;
            color: var(--tinta-suave); opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <a href="/" class="login-logo">EZSENCIA</a>
        <span class="login-eyebrow">Área de Socios</span>
        <h1 class="login-title">Edición<br>Fundadores 2026</h1>
        <div class="login-sep"></div>
        <form id="loginForm" novalidate>
            <div class="login-field">
                <label class="login-label" for="email">Correo electrónico</label>
                <input class="login-input" type="email" id="email" name="email"
                       required autocomplete="email" placeholder="tu@email.com">
            </div>
            <div class="login-field">
                <label class="login-label" for="password">Contraseña</label>
                <input class="login-input" type="password" id="password" name="password"
                       required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Entrar</button>
            <p class="login-error" id="loginError">Email o contraseña incorrectos.</p>
        </form>
        <p class="login-footer">Ezsencia &nbsp;&middot;&nbsp; Alcotas, Teruel</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const _sb = window.supabase.createClient(
            'https://wclyxuxpezxksxcfsmpn.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjbHl4dXhwZXp4a3N4Y2ZzbXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MTgwMTEsImV4cCI6MjA5MjA5NDAxMX0.BKEhBt5zZVqDCv81NqtAmjRODFUM6TWRs1e26kradL8'
        );
        _sb.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.replace('/socios');
        });
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');
            btn.disabled = true; btn.textContent = '···'; errEl.style.display = 'none';
            const { error } = await _sb.auth.signInWithPassword({
                email:    document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            });
            if (error) {
                errEl.style.display = 'block'; btn.disabled = false; btn.textContent = 'Entrar';
            } else {
                window.location.replace('/socios');
            }
        });
    </script>
</body>
</html>
